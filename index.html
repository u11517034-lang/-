<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活動 08：響應式網頁設計</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; background: #f4f7f6; color: #333; margin: 0; padding: 20px; }
        /* 1. 將固定寬度改成 100%，並設定最大寬度，讓手機版不會超出畫面 */
        .page { width: 100%; max-width: 960px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; }
        .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 20px; }
        .card { background: #ecf0f1; padding: 15px; border-radius: 6px; }
        input { width: 100%; max-width: 420px; padding: 8px; box-sizing: border-box; }
        
        /* 2. 這是 RWD 的靈魂：當螢幕寬度小於 600px 時，卡片變成單欄上下排列 */
        @media (max-width: 600px) {
            .cards { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="page">
        <h1>我的響應式作品集</h1>
        <p>請試著縮放瀏覽器視窗，觀察下方卡片的排列變化。</p>
        
        <label for="email">訂閱電子報：</label>
        <input type="text" id="email" placeholder="輸入 Email">

        <div class="cards">
            <div class="card">
                <h3>作品一</h3>
                <p>在寬螢幕下，我們三個會並排在一起。到了手機版，我就會變成第一排。</p>
            </div>
            <div class="card">
                <h3>作品二</h3>
                <p>響應式設計（RWD）讓網頁能自動適應不同尺寸的螢幕。</p>
            </div>
            <div class="card">
                <h3>作品三</h3>
                <p>不會因為螢幕太小而讓字被切斷，或是需要左右滑動才能看完。</p>
            </div>
        </div>
    </div>
</body>
</html>
