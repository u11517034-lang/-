<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>紙橋挑戰社：活動準備頁</title>
    <style>
        /* 延續乾淨好看的版型設計，並加上表格樣式 */
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: #f0f4f8; color: #333; max-width: 700px; margin: 40px auto; padding: 40px; background: #ffffff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); line-height: 1.8; }
        h1 { color: #2b6cb0; border-bottom: 2px solid #e2e8f0; padding-bottom: 12px; }
        h2 { color: #319795; margin-top: 30px; font-size: 1.3rem; }
        ul, ol { background: #f7fafc; padding: 20px 20px 20px 40px; border-radius: 8px; }
        li { margin-bottom: 8px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        caption { font-weight: bold; color: #4a5568; margin-bottom: 10px; font-size: 1.1em; text-align: left; }
        th, td { border: 1px solid #e2e8f0; padding: 12px; text-align: left; }
        th { background-color: #edf2f7; color: #2d3748; }
        tr:nth-child(even) { background-color: #f8fafc; }
    </style>
</head>
<body>

    <h1>紙橋挑戰社：活動準備頁</h1>
    <p>我們要用簡單的材料，設計一座能承重的紙橋。</p>

    <h2>要帶的材料</h2>
    <!-- 使用 ul (unordered list) 製作無順序的點點清單 -->
    <ul>
        <li>A4 紙 3 張</li>
        <li>膠帶 1 卷</li>
        <li>積木 10 個</li>
    </ul>

    <h2>挑戰步驟</h2>
    <!-- 使用 ol (ordered list) 製作有數字順序的清單 -->
    <ol>
        <li>先畫出紙橋草圖</li>
        <li>再折出橋面並固定</li>
        <li>逐一放上積木，觀察能承受的重量</li>
        <li>記錄結果，討論如何改進</li>
    </ol>

    <h2>小組分工</h2>
    <!-- 使用 table 製作表格 -->
    <table>
        <caption>小組任務分工表</caption>
        <thead>
            <tr>
                <th scope="col">角色</th>
                <th scope="col">負責工作</th>
                <th scope="col">預計成果</th>
            </tr>
        </thead>
        <tbody>
            <!-- tr 代表表格的一列 (row)，td 代表一格資料 -->
            <tr>
                <td>設計員</td>
                <td>畫出紙橋草圖</td>
                <td>一張草圖</td>
            </tr>
            <tr>
                <td>製作員</td>
                <td>依照草圖組裝</td>
                <td>一座紙橋</td>
            </tr>
            <tr>
                <td>紀錄員</td>
                <td>記錄測試結果</td>
                <td>一份測試紀錄</td>
            </tr>
            <!-- 這是依據講義要求幫你新增的第四個角色，你也可以自由修改文字 -->
            <tr>
                <td>材料員</td>
                <td>管控紙張與膠帶用量</td>
                <td>材料使用明細</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
