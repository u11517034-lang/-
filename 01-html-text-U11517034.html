<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水與生活：小小科學探索日</title>
    <style>
        /* 這裡是幫你加上的 CSS 美化魔法 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f0f4f8; /* 淺藍灰背景 */
            color: #333;
            max-width: 650px;
            margin: 40px auto;
            padding: 40px;
            background: #ffffff; /* 白色卡片 */
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            line-height: 1.8;
        }
        h1 { color: #2b6cb0; border-bottom: 2px solid #e2e8f0; padding-bottom: 12px; }
        h2 { color: #319795; margin-top: 30px; font-size: 1.4rem; }
        h3 { color: #4a5568; font-size: 1.1rem; }
        b { color: #c53030; background: #fff5f5; padding: 2px 6px; border-radius: 4px; } /* 凸顯粗體 */
        i { color: #4c51bf; font-weight: bold; } /* 凸顯斜體 */
        sup, sub { color: #d69e2e; font-weight: bold; }
    </style>
</head>
<body>

    <!-- 以下是講義規定的 HTML 內容 -->
    <h1>水與生活：小小科學探索日</h1>
    <p>一起從生活中的水，發現科學的有趣之處。</p>

    <h2>活動介紹</h2>
    <p>這次活動適合國小中年級學生，請帶著好奇心一起參加。</p>

    <h3>觀察水的樣子</h3>
    <p>看看不同容器中的水，試著說出你觀察到的變化。</p>

    <h3>認識水的名字</h3>
    <p>水的化學式是 H<sub>2</sub>O。</p>

    <h2>參加前的小提醒</h2>
    <p>請<b>自備水壺</b>，並準備一本觀察筆記。</p>
    <p>今天的探索口號是：<i>先觀察，再提問！</i></p>
    <p>我們將使用面積為 100 cm<sup>2</sup> 的方形觀察卡。</p>

</body>
</html>
